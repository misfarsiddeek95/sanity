# /etc/nginx/sites-available/scentifyfragrances.lk
# Edge layer: TLS, per-IP request limits (first line of DDoS defence), connection caps, and trusted client-IP headers.
limit_req_zone  $binary_remote_addr zone=scentify_pages:20m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=scentify_api:10m   rate=1r/s;
limit_conn_zone $binary_remote_addr zone=scentify_conn:10m;

upstream scentify_app { server 127.0.0.1:3000; keepalive 32; }

server {
  listen 80;
  server_name scentifyfragrances.lk www.scentifyfragrances.lk;
  return 301 https://scentifyfragrances.lk$request_uri;
}

server {
  listen 443 ssl http2;
  server_name scentifyfragrances.lk www.scentifyfragrances.lk;
  # ssl_certificate / ssl_certificate_key: managed by certbot

  client_max_body_size 16k;           # forms are tiny; reject anything larger
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  send_timeout 15s;
  limit_conn scentify_conn 40;
  server_tokens off;

  gzip on; gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  location /api/ {
    limit_req zone=scentify_api burst=5 nodelay;
    proxy_pass http://scentify_app;
    include /etc/nginx/snippets/scentify-proxy.conf;
  }

  location / {
    limit_req zone=scentify_pages burst=60 nodelay;
    proxy_pass http://scentify_app;
    include /etc/nginx/snippets/scentify-proxy.conf;
  }
}

